name: Publicar GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Preparar e publicar pacote estático
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências e validar testes
        run: npm ci && npm test
      - name: Montar diretório estático de publicação
        run: |
          mkdir -p _site
          cp index.html 404.html manifest.webmanifest _site/
          cp -r assets eyeofgod _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
