<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Rota não encontrada | Piauí Teresina Analytics</title>
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 18%, #0f2b21 0%, #0a0a0f 62%);
      color: #e4f5ec;
      font-family: 'Courier New', monospace;
    }
    .card {
      max-width: 620px;
      width: 100%;
      padding: 2.2rem;
      border-radius: 14px;
      background: rgba(13, 21, 24, 0.92);
      border: 1px solid #245846;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }
    .code {
      display: inline-block;
      padding: 0.3rem 0.65rem;
      border: 1px solid #00ff4166;
      border-radius: 4px;
      color: #00ff41;
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: #ffffff;
      margin-bottom: 0.75rem;
    }
    p {
      color: #9eb7ae;
      line-height: 1.65;
      font-size: 0.92rem;
      margin-bottom: 1.5rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    a {
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #2d5d4b;
      color: #baf9d3;
      background: #10241c;
    }
    a.primary {
      background: #00ff41;
      color: #04150a;
      border-color: #00ff41;
    }
    a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="card">
    <span class="code">// ERRO 404 • ROTA NÃO ENCONTRADA</span>
    <h1>Coordenada fora do mapa.</h1>
    <p>O endereço solicitado não existe neste painel estático. Utilize os atalhos abaixo para acessar as análises do Piauí e de Teresina.</p>
    <div class="actions">
      <a class="primary" href="./">← Painel Principal</a>
      <a href="./#territorios">🗺️ Municípios &amp; Territórios</a>
      <a href="./#energia">⚡ Energia &amp; Simulador</a>
      <a href="./#spia">◉ SPIA Piauí</a>
      <a href="./eyeofgod/">👁️ Eye of God</a>
    </div>
  </main>
</body>
</html>
